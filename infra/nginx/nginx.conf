events {}

http {
    # DNS de Docker: resuelve el nombre del servicio en cada petición. Si una región está apagada,
    # el gateway sigue arriba y responde 503 solo para esa región.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Límite de tasa por IP (protección básica contra abuso)
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # Id de correlación: se respeta el que manda el cliente o se genera uno
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format main '$remote_addr "$request" $status $request_time cid=$correlation_id upstream=$upstream_addr';
    access_log /dev/stdout main;

    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # TLS de desarrollo: certificado autofirmado que genera el contenedor al primer arranque
    # (infra/nginx/40-dev-certificate.sh). HTTPS en el puerto 8443; HTTP en 8000 sigue para scripts y el proxy de Angular.
    ssl_certificate     /etc/nginx/certs/jornal-dev.crt;
    ssl_certificate_key /etc/nginx/certs/jornal-dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1h;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        limit_req zone=api burst=40 nodelay;

        # Consultas internas entre servicios: nunca se exponen hacia afuera
        location ~ ^/api/[a-z]+/internal/ {
            return 404;
        }

        # Métricas y actuator solo dentro de la red interna (Prometheus); la salud sí se publica
        location ~ ^/api/[a-z]+/actuator/(?!health) {
            return 404;
        }

        # WebSocket de notificaciones (STOMP): necesita el Upgrade y una lectura larga
        location = /subsystems/notifications/ws {
            set $ws_upstream notifications;
            proxy_pass http://$ws_upstream:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_intercept_errors on;
            error_page 502 504 = @region_down;
        }

        # Enrutamiento por ruta: /api/{región}/... -> core-{región}
        location ~ ^/api/(co|br|us|fr|jp|de)/(.*)$ {
            set $upstream core-$1;
            proxy_pass http://$upstream:8080/$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/$1;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_intercept_errors on;
            error_page 502 504 = @region_down;
        }

        # Estado de los subsistemas (demostraciones): /subsystems/payments/status
        location ~ ^/subsystems/(payments|dispatch|notifications|billing)/(.*)$ {
            set $upstream $1;
            proxy_pass http://$upstream:8080/$2$is_args$args;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_intercept_errors on;
            error_page 502 504 = @region_down;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location @region_down {
            default_type application/problem+json;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The region or service is not available","code":"SERVICE_UNAVAILABLE"}';
        }
    }

    # Enrutamiento por subdominio: co.jornal.localhost -> core-co
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name ~^(?<region>co|br|us|fr|jp|de)\.jornal\.localhost$;
        limit_req zone=api burst=40 nodelay;

        location /internal/ {
            return 404;
        }

        location ~ ^/actuator/(?!health) {
            return 404;
        }

        location / {
            set $upstream core-$region;
            proxy_pass http://$upstream:8080$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_intercept_errors on;
            error_page 502 504 = @region_down;
        }

        location @region_down {
            default_type application/problem+json;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The region is not available","code":"SERVICE_UNAVAILABLE"}';
        }
    }
}
