# Sistema completo: 5 cores regionales + 4 subsistemas + infraestructura.
#
#   docker compose -f infra/docker-compose.yml up -d --build                 # CO y BR (desarrollo, más liviano)
#   docker compose -f infra/docker-compose.yml --profile full up -d --build  # las 5 regiones (demostración)
#
# Entrada única: gateway en http://localhost:8000  (/api/co/..., /api/br/..., /subsystems/payments/status)
# Valores por defecto SOLO para desarrollo; en otro entorno se pasan por variables.
name: jornal

x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 10

x-core-env: &core-env
  SPRING_PROFILES_ACTIVE: prod
  DB_USER: ${POSTGRES_USER:-jornalAdmin}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-jornal-dev-password}
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-jornal}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-jornal-dev-password}
  JWT_ISSUER: jornal-docker
  JWT_SECRET: ${JWT_SECRET:-docker-dev-only-secret-change-me-32-bytes!!}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
  SPRINGDOC_API_DOCS_ENABLED: "true"
  SPRINGDOC_SWAGGER_UI_ENABLED: "true"
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-docker-dev-only-internal-token}
  RABBITMQ_API: http://rabbitmq:15672/api
  # Regiones con colas en RabbitMQ. DE (Alemania) es el sexto país, solo con datos: su core arranca con --profile de
  MESSAGING_REGIONS: &regions co,br,us,fr,jp,de
  # Servicios que vigila la consola de administración (GET /admin/console)
  CONSOLE_SERVICES: >-
    gateway=http://gateway/health,
    core-co=http://core-co:8080/actuator/health,core-br=http://core-br:8080/actuator/health,
    core-us=http://core-us:8080/actuator/health,core-fr=http://core-fr:8080/actuator/health,
    core-jp=http://core-jp:8080/actuator/health,core-de=http://core-de:8080/actuator/health,
    payments=http://payments:8080/actuator/health,dispatch=http://dispatch:8080/actuator/health,
    notifications=http://notifications:8080/actuator/health,billing=http://billing:8080/actuator/health

x-core: &core
  <<: *app
  image: jornal/core:dev
  build:
    context: ..
    args:
      MODULE: jornal-core

x-subsystem-env: &subsystem-env
  SERVER_PORT: "8080"
  REDIS_HOST: redis
  JWT_ISSUER: jornal-docker
  JWT_SECRET: ${JWT_SECRET:-docker-dev-only-secret-change-me-32-bytes!!}
  DB_USER: ${POSTGRES_USER:-jornalAdmin}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-jornal-dev-password}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-jornal}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-jornal-dev-password}
  MESSAGING_REGIONS: *regions

services:
  # ------------------------------------------------------------------ cores regionales (mismo jar)
  core-co:
    <<: *core
    environment:
      <<: *core-env
      APP_REGION: CO
      DB_URL: jdbc:postgresql://postgres:5432/jornal_co
      ADMIN_EMAIL: admin@co.jornal.test

  core-br:
    <<: *core
    environment:
      <<: *core-env
      APP_REGION: BR
      DB_URL: jdbc:postgresql://postgres:5432/jornal_br
      ADMIN_EMAIL: admin@br.jornal.test

  core-us:
    <<: *core
    profiles: [full]
    environment:
      <<: *core-env
      APP_REGION: US
      DB_URL: jdbc:postgresql://postgres:5432/jornal_us
      ADMIN_EMAIL: admin@us.jornal.test

  core-fr:
    <<: *core
    profiles: [full]
    environment:
      <<: *core-env
      APP_REGION: FR
      DB_URL: jdbc:postgresql://postgres:5432/jornal_fr
      ADMIN_EMAIL: admin@fr.jornal.test

  core-jp:
    <<: *core
    profiles: [full]
    environment:
      <<: *core-env
      APP_REGION: JP
      DB_URL: jdbc:postgresql://postgres:5432/jornal_jp
      ADMIN_EMAIL: admin@jp.jornal.test

  # Sexto país solo con datos (migración V18): mismo jar, otra base y otro APP_REGION.
  # scripts/demo-pais-nuevo.sh crea la base jornal_de si el volumen es anterior y lo levanta.
  core-de:
    <<: *core
    profiles: [de]
    environment:
      <<: *core-env
      APP_REGION: DE
      DB_URL: jdbc:postgresql://postgres:5432/jornal_de
      ADMIN_EMAIL: admin@de.jornal.test

  # ------------------------------------------------------------------ subsistemas
  payments:
    <<: *app
    image: jornal/payments:dev
    build: { context: .., args: { MODULE: jornal-payments } }
    environment:
      <<: *subsystem-env
      DB_URL: jdbc:postgresql://postgres:5432/jornal_payments

  dispatch:
    <<: *app
    image: jornal/dispatch:dev
    build: { context: .., args: { MODULE: jornal-dispatch } }
    environment:
      <<: *subsystem-env
      DB_URL: jdbc:postgresql://postgres:5432/jornal_dispatch
      # Plazos de la búsqueda; scripts/falla-nadie-acepta.sh los baja para la demostración
      DISPATCH_SEARCH_TIMEOUT: ${DISPATCH_SEARCH_TIMEOUT:-120s}
      DISPATCH_OFFER_TIMEOUT: ${DISPATCH_OFFER_TIMEOUT:-45s}

  notifications:
    <<: *app
    image: jornal/notifications:dev
    build: { context: .., args: { MODULE: jornal-notifications } }
    environment:
      <<: *subsystem-env
      DB_URL: jdbc:postgresql://postgres:5432/jornal_notifications
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      CORE_URL_TEMPLATE: http://core-{region}:8080   # el contacto se pide al core de la región
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-docker-dev-only-internal-token}

  billing:
    <<: *app
    image: jornal/billing:dev
    build: { context: .., args: { MODULE: jornal-billing } }
    environment:
      <<: *subsystem-env
      DB_URL: jdbc:postgresql://postgres:5432/jornal_billing
      # Emisor del sexto país por configuración (datos FICTICIOS, VERIFICAR)
      JORNAL_BILLING_ISSUERS_DE_NAME: "Jornal Deutschland GmbH (fiktiv)"
      JORNAL_BILLING_ISSUERS_DE_TAXID: "USt-IdNr. DE000000000 (VERIFICAR)"

  # ------------------------------------------------------------------ entrada
  gateway:
    image: jornal/gateway:dev
    build: ./nginx            # nginx + certificado TLS autofirmado de desarrollo (se genera al primer arranque)
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:80"
      - "${GATEWAY_TLS_PORT:-8443}:443"   # https://localhost:8443/api/co/...
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - jornal-certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------ infraestructura
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: jornal
      POSTGRES_USER: ${POSTGRES_USER:-jornalAdmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jornal-dev-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${INFRA_POSTGRES_PORT:-55432}:5432"
    volumes:
      - jornal-pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jornalAdmin} -d jornal"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-jornal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-jornal-dev-password}
    ports:
      - "${INFRA_RABBITMQ_UI_PORT:-15673}:15672"   # consola de RabbitMQ
    volumes:
      - jornal-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"   # bandeja de correos de prueba

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  jornal-pgdata:
  jornal-rabbitmq:
  jornal-certs:
