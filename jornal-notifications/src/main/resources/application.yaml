server:
  # Render asigna el puerto en PORT
  port: ${PORT:${SERVER_PORT:8083}}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
spring:
  application:
    name: jornal-notifications
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jornal_notifications}
    username: ${DB_USER:jornalAdmin}
    password: ${DB_PASSWORD:change-me}
    # Render (una sola base): cada servicio en su esquema (DB_SCHEMA). public queda en la ruta para PostGIS.
    hikari:
      connection-init-sql: SET search_path TO ${DB_SCHEMA:public}, public
  rabbitmq:
    # CloudAMQP u otro broker externo: variable SPRING_RABBITMQ_ADDRESSES=amqps://usuario:clave@host/vhost
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # agotados los reintentos, a la cola de mensajes muertos
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  flyway:
    locations: classpath:db/subsystem,classpath:db/migration
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
  mail:
    # Mailpit en desarrollo y Docker (no entrega correo real)
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # SMTP real (opcional en Render): si no hay, el aviso por correo queda FAILED y el resto sigue funcionando
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
  messages:
    basename: templates/notifications
    encoding: UTF-8
    fallback-to-system-locale: false
jornal:
  subsystem:
    name: notifications
  messaging:
    regions: ${MESSAGING_REGIONS:co,br,us,fr,jp}
    consumers: ${MESSAGING_CONSUMERS:}   # vacío = todos; en Render: core,payments,notifications
  security:
    jwt:
      # Mismo secreto y emisor que los cores: el WebSocket y /notifications/me usan el token del usuario.
      issuer: ${JWT_ISSUER:jornal-dev}
      secret: ${JWT_SECRET:dev-only-secret-change-me-minimum-32-bytes!!}
  # Orígenes del frontend que pueden llamar a este servicio directamente (Render, sin gateway)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  notifications:
    # Core de cada región para pedir el contacto ({region} = co, br...). En Docker: http://core-{region}:8080
    # En Render: la URL pública del core, por ejemplo https://jornal-core-co.onrender.com
    # Render Blueprint: CORE_URL_SCHEME=https, CORE_HOST (fromService host) y CORE_HOST_SUFFIX=.onrender.com
    core-url: ${CORE_URL_TEMPLATE:${CORE_URL_SCHEME:http}://${CORE_HOST:localhost}${CORE_HOST_SUFFIX::8080}}
    internal-token: ${INTERNAL_TOKEN:dev-only-internal-token}
    contact-attempts: 3
    contact-backoff: 300ms
    mail-from: ${MAIL_FROM:notificaciones@jornal.test}
management:
  health:
    mail:
      enabled: false   # el correo es de mejor esfuerzo: si Mailpit cae, el aviso queda FAILED y el servicio sigue sano
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  pattern:
    # Id de correlación (X-Correlation-Id del gateway o correlationid del mensaje) en cada línea de log
    correlation: "[cid=%X{cid:-}] "
