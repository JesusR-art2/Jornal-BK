server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: jornal-notifications
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jornal_notifications}
    username: ${DB_USER:jornalAdmin}
    password: ${DB_PASSWORD:change-me}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # agotados los reintentos, a la cola de mensajes muertos
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  flyway:
    locations: classpath:db/subsystem,classpath:db/migration
  mail:
    # Mailpit en desarrollo y Docker (no entrega correo real)
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  messages:
    basename: templates/notifications
    encoding: UTF-8
    fallback-to-system-locale: false
jornal:
  subsystem:
    name: notifications
  messaging:
    regions: ${MESSAGING_REGIONS:co,br,us,fr,jp}
  security:
    jwt:
      # Mismo secreto y emisor que los cores: el WebSocket y /notifications/me usan el token del usuario.
      issuer: ${JWT_ISSUER:jornal-dev}
      secret: ${JWT_SECRET:dev-only-secret-change-me-minimum-32-bytes!!}
  notifications:
    # Core de cada región para pedir el contacto ({region} = co, br...). En Docker: http://core-{region}:8080
    core-url: ${CORE_URL_TEMPLATE:http://localhost:8080}
    internal-token: ${INTERNAL_TOKEN:dev-only-internal-token}
    contact-attempts: 3
    contact-backoff: 300ms
    mail-from: ${MAIL_FROM:notificaciones@jornal.test}
management:
  health:
    mail:
      enabled: false   # el correo es de mejor esfuerzo: si Mailpit cae, el aviso queda FAILED y el servicio sigue sano
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
