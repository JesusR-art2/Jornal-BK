vacancy.SELECTED.worker.body=Ha sido seleccionado para {title}. Preséntese en {address} el {when} (finaliza {until}). {items, select, none {No es necesario llevar implementos.} other {Debe llevar: {items}.}} ¿Podrá asistir? Por favor, confírmelo en la aplicación.
vacancy.CONFIRMED.employer.title=Asistencia confirmada
