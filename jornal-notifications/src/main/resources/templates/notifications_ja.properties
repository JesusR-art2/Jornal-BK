offer.worker.title=新しい仕事のオファー
offer.worker.body=新しい仕事：{category}（{address}、{distance, number} km先）、{when}。承諾まで残り{seconds, plural, other {#秒}}です。

status.PENDING_PAYMENT.client.title=ご依頼を受け付けました
status.PENDING_PAYMENT.client.body={when}の{category}のご依頼を受け付けました。お支払いを処理しています。
status.SEARCHING_WORKER.client.title=ワーカーを探しています
status.SEARCHING_WORKER.client.body=お支払いが承認されました。{when}の{category}のワーカーを探しています。
status.ASSIGNED.client.title=ワーカーが決まりました
status.ASSIGNED.client.body={when}の{category}のご依頼をワーカーが引き受けました。
status.ASSIGNED.worker.title=仕事が確定しました
status.ASSIGNED.worker.body={when}の{category}の仕事が確定しました。出発したら「移動中」にしてください。
status.EN_ROUTE.client.title=ワーカーが向かっています
status.EN_ROUTE.client.body={category}のワーカーが向かっています。アプリで現在地を確認できます。
status.EN_ROUTE.worker.title=移動中
status.EN_ROUTE.worker.body={category}の現場へ移動中です。お客様にあなたの位置が表示されます。
status.IN_PROGRESS.client.title=作業を開始しました
status.IN_PROGRESS.client.body={category}の作業が始まりました。
status.IN_PROGRESS.worker.title=作業を開始しました
status.IN_PROGRESS.worker.body={category}の作業を開始しました。
status.PENDING_CONFIRMATION.client.title=作業の確認をお願いします
status.PENDING_CONFIRMATION.client.body=ワーカーが{category}を完了しました。アプリで確認してください。操作がない場合は自動的に確認されます。
status.PENDING_CONFIRMATION.worker.title=確認待ち
status.PENDING_CONFIRMATION.worker.body={category}を完了しました。お客様の確認を待っています。
status.COMPLETED.client.title=ご依頼が完了しました
status.COMPLETED.client.body={category}のご依頼が完了しました。Jornalをご利用いただきありがとうございます。
status.COMPLETED.worker.title=仕事が完了しました
status.COMPLETED.worker.body={category}の仕事が完了し、報酬の精算が済みました。
status.CANCELLED.client.title=ご依頼がキャンセルされました
status.CANCELLED.client.body={when}の{category}のご依頼はキャンセルされました。請求済みの場合は返金されます。
status.CANCELLED.worker.title=仕事がキャンセルされました
status.CANCELLED.worker.body={when}の{category}の仕事はキャンセルされました。
status.FAILED.client.title=ご依頼を完了できませんでした
status.FAILED.client.body={category}のご依頼を完了できませんでした。請求済みの場合は返金されます。
status.EXPIRED.client.title=対応できるワーカーがいませんでした
status.EXPIRED.client.body={when}の{category}に対応できるワーカーがいませんでした。お支払いの保留は解除されました。
