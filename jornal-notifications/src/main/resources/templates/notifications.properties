# Plantillas de notificación (ICU MessageFormat). Base: en-US. Argumentos: category, when, address, distance, seconds.
# Cada clave es <plantilla>.<audiencia>.title|body. Si no hay plantilla para una audiencia, no se le avisa.
offer.worker.title=New job offer
offer.worker.body=New job: {category} at {address}, {distance, number} km away, on {when}. You have {seconds, plural, one {# second} other {# seconds}} to accept.

status.PENDING_PAYMENT.client.title=Order received
status.PENDING_PAYMENT.client.body=We have received your order for {category} on {when}. Your payment is being processed.
status.SEARCHING_WORKER.client.title=Searching for a worker
status.SEARCHING_WORKER.client.body=Your payment has been authorized. We are searching for a worker for {category} on {when}.
status.ASSIGNED.client.title=Worker assigned
status.ASSIGNED.client.body=A worker has accepted your order for {category} on {when}.
status.ASSIGNED.worker.title=Job assigned
status.ASSIGNED.worker.body=You have been assigned the job {category} on {when}. Please indicate in the app when you are on your way.
status.EN_ROUTE.client.title=Your worker is on the way
status.EN_ROUTE.client.body=Your worker for {category} is on the way. You can follow their progress in real time in the app.
status.EN_ROUTE.worker.title=On the way
status.EN_ROUTE.worker.body=You are on your way to the job {category}. The client can see your location.
status.IN_PROGRESS.client.title=Work started
status.IN_PROGRESS.client.body=The work for {category} has started.
status.IN_PROGRESS.worker.title=Work started
status.IN_PROGRESS.worker.body=You have started the job {category}.
status.PENDING_CONFIRMATION.client.title=Work confirmation required
status.PENDING_CONFIRMATION.client.body=The worker has finished {category}. Please confirm the work in the app; otherwise, it will be confirmed automatically.
status.PENDING_CONFIRMATION.worker.title=Awaiting confirmation
status.PENDING_CONFIRMATION.worker.body=You have finished {category}. We are awaiting confirmation from the client.
status.COMPLETED.client.title=Order completed
status.COMPLETED.client.body=Your order for {category} has been completed. Thank you for using Jornal.
status.COMPLETED.worker.title=Job completed
status.COMPLETED.worker.body=The job {category} has been completed and your payment has been settled.
status.CANCELLED.client.title=Order cancelled
status.CANCELLED.client.body=Your order for {category} on {when} has been cancelled. Any amount charged will be refunded.
status.CANCELLED.worker.title=Job cancelled
status.CANCELLED.worker.body=The job {category} on {when} has been cancelled.
status.FAILED.client.title=Order not completed
status.FAILED.client.body=Your order for {category} could not be completed. Any amount charged will be refunded.
status.EXPIRED.client.title=No workers available
status.EXPIRED.client.body=No workers were available for {category} on {when}. Your payment hold has been released.

# Vacantes. Argumentos: title, address, when (inicio), until (fin), items (o "none"), distance, worker, justification.
vacancy.published.worker.title=New vacancy in your area
vacancy.published.worker.body={title} at {address}, {distance, number} km away, on {when}. Please open the app to view the details and apply.
vacancy.APPLIED.employer.title=New application
vacancy.APPLIED.employer.body={worker} has applied to {title}.
vacancy.SELECTED.worker.title=Selection confirmed
vacancy.SELECTED.worker.body=You have been selected for {title}. Please report to {address} on {when} (ends {until}). {items, select, none {No equipment is required.} other {Please bring: {items}.}} Will you be able to attend? Please confirm in the app.
vacancy.CONFIRMED.employer.title=Attendance confirmed
vacancy.CONFIRMED.employer.body={worker} has confirmed attendance for {title} on {when}.
vacancy.DECLINED.employer.title=Worker unable to attend
vacancy.DECLINED.employer.body={worker} is unable to attend {title}. The position is available again; you may select another applicant.
vacancy.WITHDRAWN.employer.title=Application withdrawn
vacancy.WITHDRAWN.employer.body={worker} has withdrawn their application for {title}.
vacancy.NOT_SELECTED.worker.title=Vacancy closed
vacancy.NOT_SELECTED.worker.body=We regret to inform you that you were not selected for {title} on this occasion.
vacancy.VACANCY_CANCELLED.worker.title=Vacancy cancelled
vacancy.VACANCY_CANCELLED.worker.body=The employer has cancelled {title} scheduled for {when}. You are not required to attend.
vacancy.COMPLETED.worker.title=Work completed
vacancy.COMPLETED.worker.body=The employer has marked your work at {title} as completed. Your payment is pending.
vacancy.CANCELLED.worker.title=Work not paid
vacancy.CANCELLED.worker.body=The employer has cancelled your participation in {title}, and it will not be paid. Reason: {justification}
vacancy.PAID.worker.title=Payment completed
vacancy.PAID.worker.body=You have been paid {amount, number} {currency} for your work at {title}.{note, select, none {} other { Employer note: {note}}}
vacancy.PAYOUT_FAILED.employer.title=Automatic payment unsuccessful
vacancy.PAYOUT_FAILED.employer.body=The automatic payment to {worker} for {title} could not be completed. You may pay manually from the payments list.
