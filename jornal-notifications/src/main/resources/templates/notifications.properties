# Plantillas de notificación (ICU MessageFormat). Base: en-US. Argumentos: category, when, address, distance, seconds.
# Cada clave es <plantilla>.<audiencia>.title|body. Si no hay plantilla para una audiencia, no se le avisa.
offer.worker.title=New job offer
offer.worker.body=New job: {category} at {address}, {distance, number} km away, on {when}. You have {seconds, plural, one {# second} other {# seconds}} to accept.

status.PENDING_PAYMENT.client.title=Request received
status.PENDING_PAYMENT.client.body=We received your request for {category} on {when}. We are processing the payment.
status.SEARCHING_WORKER.client.title=Looking for a worker
status.SEARCHING_WORKER.client.body=Payment authorized. We are looking for a worker for {category} on {when}.
status.ASSIGNED.client.title=Worker assigned
status.ASSIGNED.client.body=A worker accepted your request for {category} on {when}.
status.ASSIGNED.worker.title=Job assigned
status.ASSIGNED.worker.body=The job {category} on {when} is yours. Remember to mark when you are on your way.
status.EN_ROUTE.client.title=Your worker is on the way
status.EN_ROUTE.client.body=Your worker is on the way for {category}. You can follow them live in the app.
status.EN_ROUTE.worker.title=On your way
status.EN_ROUTE.worker.body=You are on your way to the job {category}. The client can see your position.
status.IN_PROGRESS.client.title=Work started
status.IN_PROGRESS.client.body=The work for {category} has started.
status.IN_PROGRESS.worker.title=Work started
status.IN_PROGRESS.worker.body=You started the job {category}.
status.PENDING_CONFIRMATION.client.title=Please confirm the work
status.PENDING_CONFIRMATION.client.body=The worker finished {category}. Confirm the work in the app; if you do nothing, it will be confirmed automatically.
status.PENDING_CONFIRMATION.worker.title=Waiting for confirmation
status.PENDING_CONFIRMATION.worker.body=You finished {category}. We are waiting for the client to confirm.
status.COMPLETED.client.title=Request completed
status.COMPLETED.client.body=Your request for {category} is complete. Thank you for using Jornal!
status.COMPLETED.worker.title=Job completed
status.COMPLETED.worker.body=The job {category} is complete and your payment has been settled.
status.CANCELLED.client.title=Request cancelled
status.CANCELLED.client.body=Your request for {category} on {when} was cancelled. If you were charged, the money will be refunded.
status.CANCELLED.worker.title=Job cancelled
status.CANCELLED.worker.body=The job {category} on {when} was cancelled.
status.FAILED.client.title=Request not completed
status.FAILED.client.body=Your request for {category} could not be completed. If you were charged, the money will be refunded.
status.EXPIRED.client.title=No worker available
status.EXPIRED.client.body=No worker was available for {category} on {when}. Your payment was released.
