jornal:
  security:
    jwt:
      issuer: jornal-dev
      secret: ${JWT_SECRET:dev-only-secret-change-me-minimum-32-bytes!!}
spring:
  docker:
    compose:
      enabled: true
      # Relativo al directorio de trabajo, que es la raíz del repositorio: es el que usa IntelliJ por defecto,
      # y spring-boot:run arranca ahí también (workingDirectory en jornal-core/pom.xml).
      file: docker-compose.yaml
      lifecycle-management: start-only   # los contenedores siguen vivos al detener la app
  jpa:
    show-sql: true

logging:
  level:
    com.jornal: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"