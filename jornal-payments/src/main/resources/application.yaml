server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: jornal-payments
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jornal_payments}
    username: ${DB_USER:jornalAdmin}
    password: ${DB_PASSWORD:change-me}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # agotados los reintentos, a la cola de mensajes muertos
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  flyway:
    locations: classpath:db/subsystem,classpath:db/migration
jornal:
  subsystem:
    name: payments
  messaging:
    regions: ${MESSAGING_REGIONS:co,br,us,fr,jp}
  payments:
    simulator:
      failure-rate: ${PAYMENTS_FAILURE_RATE:0}              # 0..1: probabilidad de rechazo
      decline-methods: ${PAYMENTS_DECLINE_METHODS:}         # medios siempre rechazados, por ejemplo CARD
      latency: ${PAYMENTS_LATENCY:0ms}
      voucher-auto-pay-after: ${PAYMENTS_VOUCHER_AUTO_PAY_AFTER:10s}   # 0s = solo por webhook
      voucher-expire-after: ${PAYMENTS_VOUCHER_EXPIRE_AFTER:90s}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
