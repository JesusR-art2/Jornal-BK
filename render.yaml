# Render Blueprint: despliegue de demostración (plan gratuito, región Oregon, las 6 regiones con datos).
# Crea la base PostgreSQL, el Key Value (Redis) y los servicios que necesita el frontend:
#   jornal-core-co       API de Colombia (cuentas, catálogo, vacantes, pagos de vacantes); tiene los valores
#                        compartidos (JWT, token interno, RabbitMQ, CORS, administrador inicial)
#   jornal-core-br/us/fr/jp/de  mismo jar para Brasil, Estados Unidos, Francia, Japón y Alemania: su APP_REGION y
#                        su esquema (core_<región>) en la misma base; copian de jornal-core-co los valores compartidos
#   jornal-payments      pago automático al trabajador
#   jornal-notifications avisos, bandeja y WebSocket (/ws)
# RabbitMQ no lo ofrece Render: se usa CloudAMQP (plan gratuito) y su URL se pide al crear el Blueprint.
# Guía completa: docs/DESPLIEGUE-RENDER.md

databases:
  - name: jornal-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: jornal
    user: jornal
    # Una sola base para todos: cada servicio usa su esquema (DB_SCHEMA). PostGIS queda en public.

services:
  # ------------------------------------------------------------------ Redis (Key Value de Render)
  - type: keyvalue
    name: jornal-keyvalue
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # solo conexiones internas

  # ------------------------------------------------------------------ core de Colombia
  - type: web
    name: jornal-core-co
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./jornal-core/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_REGION
        value: CO
      # postgresql://usuario:clave@host:puerto/base: la aplicación la traduce a JDBC
      - key: DATABASE_URL
        fromDatabase:
          name: jornal-db
          property: connectionString
      - key: DB_SCHEMA
        value: core_co
      # 6 cores + pagos + notificaciones contra una base gratuita: 5 conexiones por core (por defecto son 10)
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
        value: "5"
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: jornal-keyvalue
          property: connectionString
      # URL AMQP de CloudAMQP (amqps://usuario:clave@host/vhost)
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: MESSAGING_REGIONS
        value: co,br,us,fr,jp,de
      - key: MESSAGING_CONSUMERS
        value: core,payments,notifications
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: jornal-render
      - key: INTERNAL_TOKEN
        generateValue: true
      # Origen del frontend (por ejemplo https://jornal-ft.onrender.com); varios separados por coma
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: TRANSLATION_URL     # sin traducción automática en el plan gratuito
        value: ""

  # ------------------------------------------------------------------ core de Brasil
  - type: web
    name: jornal-core-br
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./jornal-core/Dockerfile
    dockerContext: .
