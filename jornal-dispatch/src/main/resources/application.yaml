server:
  # Render asigna el puerto en PORT
  port: ${PORT:${SERVER_PORT:8082}}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
spring:
  application:
    name: jornal-dispatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jornal_dispatch}
    username: ${DB_USER:jornalAdmin}
    password: ${DB_PASSWORD:change-me}
    # Render (una sola base): cada servicio en su esquema (DB_SCHEMA). public queda en la ruta para PostGIS.
    hikari:
      connection-init-sql: SET search_path TO ${DB_SCHEMA:public}, public
  data:
    redis:
      # Render Key Value u otro Redis: variable SPRING_DATA_REDIS_URL=redis://... (reemplaza host y puerto)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    # CloudAMQP u otro broker externo: variable SPRING_RABBITMQ_ADDRESSES=amqps://usuario:clave@host/vhost
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # agotados los reintentos, a la cola de mensajes muertos
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  flyway:
    locations: classpath:db/subsystem,classpath:db/migration
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
jornal:
  subsystem:
    name: dispatch
  messaging:
    regions: ${MESSAGING_REGIONS:co,br,us,fr,jp}
    consumers: ${MESSAGING_CONSUMERS:}   # vacío = todos; en Render: core,payments,notifications
  security:
    jwt:
      # Mismo secreto y emisor que los cores: dispatch valida el token del trabajador y del cliente.
      issuer: ${JWT_ISSUER:jornal-dev}
      secret: ${JWT_SECRET:dev-only-secret-change-me-minimum-32-bytes!!}
  dispatch:
    offer-timeout: ${DISPATCH_OFFER_TIMEOUT:45s}      # plazo para aceptar una oferta
    search-timeout: ${DISPATCH_SEARCH_TIMEOUT:120s}   # sin candidatos durante este tiempo: assignment-failed
    max-offers: ${DISPATCH_MAX_OFFERS:5}              # ofertas por pedido antes de rendirse
    live-ttl: ${DISPATCH_LIVE_TTL:60s}                # una posición en vivo más vieja se descarta
management:
  metrics:
    distribution:
      percentiles-histogram:
        "[jornal.dispatch.assignment.time]": true   # para p50 y p95 en Grafana
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  pattern:
    # Id de correlación (X-Correlation-Id del gateway o correlationid del mensaje) en cada línea de log
    correlation: "[cid=%X{cid:-}] "
