jornal:
  security:
    jwt:
      issuer: jornal-dev
      secret: ${JWT_SECRET:dev-only-secret-change-me-minimum-32-bytes!!}
spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only   # los contenedores siguen vivos al detener la app
  jpa:
    show-sql: true

logging:
  level:
    com.jornal: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"